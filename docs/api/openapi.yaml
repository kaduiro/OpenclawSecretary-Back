openapi: 3.1.0
info:
  title: OpenClaw Mail Secretary API
  version: 2.0.0
  description: >
    Canonical HTTPS REST API surface for clawd-on-desk Electron HUD,
    openclaw-hud-gateway, and the private organization-scoped OpenClaw Cloud Run service.
    The HUD uses only the IAP-protected gateway URL; it never calls the private
    openclaw-api URL directly. Initial OAuth is browser navigation through the
    gateway. The private API performs confidential Google OAuth code exchange
    with the OAuth client secret from Secret Manager, stores the Gmail refresh
    token in Secret Manager, and returns only short-lived Google ID tokens plus
    sanitized claims to the HUD. The HUD never receives, sends, or persists
    refresh tokens, access tokens, authorization codes, code verifiers, or
    OAuth client secrets.
servers:
  - url: https://{gatewayHost}
    variables:
      gatewayHost:
        default: openclaw-hud-gateway.example.run.app
security:
  - googleIdToken: []
tags:
  - name: health
  - name: auth
  - name: events
  - name: mail
  - name: calendar
  - name: faq
  - name: settings
  - name: errors
  - name: internal
paths:
  /livez:
    get:
      tags: [health]
      summary: Platform liveness probe.
      description: >
        Cloud Run platform probe endpoint. It must not expose user, mail,
        calendar, token, or database details. External calls still pass through
        Cloud Run IAM when unauthenticated invocations are disabled.
      security: []
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"

  /readyz:
    get:
      tags: [health]
      summary: Operational readiness probe.
      description: >
        Operational readiness endpoint. It may check internal dependencies but
        must return only coarse readiness state and never expose user data,
        tokens, secret names, or raw errors. External calls still pass through
        Cloud Run IAM when unauthenticated invocations are disabled.
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready for authenticated /v1 requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          $ref: "#/components/responses/ProbeUnavailable"

  /v1/health:
    get:
      tags: [health]
      summary: Authenticated health check used by HUD heartbeat.
      description: >
        HUD-facing heartbeat. A valid Google ID token is required after the
        request passes Cloud Run IAM. Unauthenticated external requests return
        Cloud Run platform 403; Cloud Run startup/liveness probes must use
        /livez instead.
      operationId: getHealth
      responses:
        "200":
          description: Service and Cloud SQL are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/events:
    get:
      tags: [events]
      summary: Poll event inbox for asynchronous HUD updates.
      description: >
        Returns events that have an event_inbox_recipients row for the
        authenticated user's attendee_ref and whose recipient acked_at is null.
        Results are ordered by createdAt ascending (oldest unacknowledged first).
        The cursor is only a paging cursor and does not mark events as consumed.
        HUD restart or cursor loss must not drop unacknowledged events;
        an event becomes fully acknowledged only after every recipient row has
        a non-null acked_at.
      operationId: listEvents
      parameters:
        - name: cursor
          in: query
          required: false
          description: >
            Opaque paging cursor. Implementations should encode the last seen
            createdAt and eventId so ordering is stable even when multiple
            events share the same timestamp. The cursor does not acknowledge
            or consume events.
          schema:
            type: string
            example: "2026-06-03T10:00:00.000Z_evt-00000000-0000-0000-0000-000000000001"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Event inbox page.
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                additionalProperties: false
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  nextCursor:
                    type: [string, "null"]
                    example: "2026-06-03T10:00:00.000Z_evt-00000000-0000-0000-0000-000000000001"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/events/{eventId}/ack:
    post:
      tags: [events]
      summary: Acknowledge an event after the HUD displays or processes it.
      description: >
        Idempotently sets acked_at only on the caller's
        event_inbox_recipients row for this event. Duplicate acknowledgements
        from the same caller return 200 with the same eventId. Acknowledging a
        BU-shared event does not hide it from other recipients whose acked_at is
        still null. Returns 403 when no recipient row exists for the caller's
        attendee_ref. Fully acknowledged events are physically deleted only
        after the ACK retention window.
      operationId: acknowledgeEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event acknowledged. Duplicate acknowledgements are idempotent.
          content:
            application/json:
              schema:
                type: object
                required: [success, eventId, acknowledgedAt, fullyAcknowledged]
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  eventId:
                    type: string
                  acknowledgedAt:
                    type: string
                    format: date-time
                    description: acked_at stored on the caller's event_inbox_recipients row.
                  fullyAcknowledged:
                    type: boolean
                    description: True only when every event_inbox_recipients row for this event has non-null acked_at.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/start:
    get:
      tags: [auth]
      summary: Start browser OAuth through the IAP-protected HUD gateway.
      description: >
        Browser navigation entrypoint used by the HUD for initial login.
        The request is not a programmatic Bearer-token API call; it is protected
        by the user's IAP browser session on the gateway. The gateway asks the
        private API to create a short-lived OAuth auth session, then redirects
        the browser to Google's authorization URL. The HUD supplies only a local
        loopback return_uri. The HUD does not generate or store the OAuth
        code_verifier and never receives the authorization code. It generates
        a separate random handoff_verifier and sends only its S256 challenge.
      operationId: startOAuth
      security: []
      parameters:
        - name: return_uri
          in: query
          required: true
          description: >
            Exact HUD loopback receiver. Only numeric loopback hosts, ports
            1024-65535, and path /callback are accepted. Userinfo, query,
            fragment, localhost aliases, and external hosts are rejected.
          schema:
            type: string
            format: uri
            pattern: '^http://(127\.0\.0\.1|\[::1\]):(102[4-9]|10[3-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])/callback$'
            example: "http://127.0.0.1:23456/callback"
        - name: handoff_challenge
          in: query
          required: true
          description: Base64url SHA-256 challenge for the HUD-held handoff_verifier.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        "302":
          description: Redirect to Google authorization URL.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/auth/callback:
    get:
      tags: [auth]
      summary: Google OAuth redirect URI handled by the HUD gateway.
      description: >
        Google redirects the browser here with code and state. The gateway
        forwards code and state to the private API internal exchange endpoint.
        The private API validates state, performs confidential token exchange
        using the OAuth client secret from Secret Manager, verifies ID token
        claims and stores the Gmail refresh token in Secret Manager. The
        gateway returns a no-store transfer page that POSTs only a random
        single-use handoffCode to the HUD loopback return_uri, never an ID
        token or claims. The auth session binds return_uri, state, nonce, OAuth
        PKCE verifier, and HUD handoff challenge; the code expires after 60 seconds.
        The page uses Cache-Control: no-store, Referrer-Policy: no-referrer, and
        a script-src 'nonce-*'; default-src 'none' CSP. No refresh token is
        returned to the HUD.
      operationId: oauthCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: No-store browser handoff page for the HUD loopback listener.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/auth/handoff/redeem:
    post:
      tags: [auth]
      summary: Redeem the loopback handoff code using the HUD-held verifier.
      description: >
        Pre-login endpoint hosted by the narrowly exposed auth-bootstrap
        service. The HUD main process submits the single-use handoffCode and
        original high-entropy handoffVerifier. The bootstrap service forwards
        them using Bootstrap SA OIDC. The private API atomically consumes the
        code, compares S256(verifier) to the bound challenge, and only then
        returns a short-lived ID token. A lost response requires a new OAuth
        flow; a consumed code is never made reusable.
      operationId: redeemAuthHandoff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRedeemRequest"
      responses:
        "200":
          description: Single-use handoff redeemed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthHandoffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/id-token/refresh:
    post:
      tags: [auth]
      summary: Refresh the HUD short-lived Google ID token without exposing refresh tokens.
      description: >
        Programmatic gateway API used by TokenManager before ID token expiry.
        The HUD sends the current Google ID token in both Proxy-Authorization
        and Authorization. The gateway passes IAP and forwards Authorization to
        the private API while minting a fresh X-Serverless-Authorization token
        with the gateway service account. The private API validates the current
        ID token, uses the Secret Manager Gmail refresh token to obtain a new
        Google ID token, verifies the new claims, and returns only the new
        short-lived ID token plus sanitized claims.
      operationId: refreshHudIdToken
      responses:
        "200":
          description: New short-lived ID token issued to the HUD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdTokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/bind-subject:
    post:
      tags: [auth]
      summary: Bind a pre-registered BU user on first verified login.
      description: >
        Verifies the Google ID token without requiring an existing subject,
        hashes its normalized email, and atomically binds the subject to exactly
        one pending_subject_bind user. Replays, email mismatches, and already
        bound users fail closed.
      operationId: bindFirstLoginSubject
      responses:
        "201":
          description: Subject bound and user activated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectBindResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/gmail-self-registration:
    post:
      tags: [auth]
      summary: Register the caller's personal Workspace Gmail account.
      description: >
        Idempotently confirms the personal Workspace Gmail registration already
        provisioned by the confidential OAuth exchange. The exchange validates
        Google claims and BU address conflicts, generates attendee_ref, creates
        the users row, and stores refresh-token/{attendee_ref} before returning
        a usable HUD ID token. Unknown subjects are never admitted through the
        normal application allowlist solely to call this endpoint (D-37).
      operationId: registerPersonalGmailAccount
      responses:
        "201":
          description: Personal Gmail account registered for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSelfRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /internal/auth/oauth-sessions:
    post:
      tags: [internal]
      summary: Create a short-lived OAuth auth session for the gateway.
      description: >
        Gateway-to-private-API internal endpoint. The private API creates
        state and code_verifier, stores them in a short-lived auth session, and
        binds the exact return URI and HUD-provided handoff challenge before
        returning a Google authorization URL. This endpoint is not directly
        callable by the HUD.
      operationId: createOAuthSession
      security:
        - gatewayOidcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSessionCreateRequest"
      responses:
        "200":
          description: OAuth auth session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSessionCreateResponse"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "403":
          $ref: "#/components/responses/InternalForbidden"

  /internal/auth/oauth-exchange:
    post:
      tags: [internal]
      summary: Confidentially exchange Google OAuth code and store refresh token.
      description: >
        Gateway-to-private-API internal endpoint. The private API validates
        state, loads the stored code_verifier, exchanges the authorization code
        at Google's token endpoint using the OAuth client secret from Secret
        Manager, validates ID token claims, stores the Gmail refresh token in
        Secret Manager, stores the short-lived ID token behind the bound
        handoff challenge, and returns only a random one-time handoffCode.
      operationId: exchangeOAuthCode
      security:
        - gatewayOidcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthExchangeRequest"
      responses:
        "200":
          description: OAuth exchange completed and refresh token stored server-side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthExchangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "403":
          $ref: "#/components/responses/InternalForbidden"

  /internal/auth/handoff/redeem:
    post:
      tags: [internal]
      summary: Atomically redeem a handoff code. Invoked only by the gateway.
      operationId: redeemInternalAuthHandoff
      security:
        - bootstrapOidcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRedeemRequest"
      responses:
        "200":
          description: Handoff consumed and ID token returned to the gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthHandoffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "403":
          $ref: "#/components/responses/InternalForbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/mail/pending:
    get:
      tags: [mail]
      summary: Poll lightweight pending-mail metadata for HUD display.
      description: >
        Returns metadata only. PII-bearing body, analysis, replyDraft, Calendar
        context, and approvalToken are fetched from GET /v1/mail/{mailId}/detail.
        Claim expiry is enforced by every claim-dependent command, not by this
        read endpoint. Personal mail is visible only to its owner; BU mail is
        visible only to active members of the same normalized BU membership.
      operationId: listPendingMailTickets
      responses:
        "200":
          description: Lightweight pending-mail tickets.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mail/{mailId}/approve:
    post:
      tags: [mail]
      summary: Approve and send a prepared Gmail draft.
      description: >
        Personal mail may be approved only by its owner. BU shared mail may be
        approved only by the current claimant, who must still be an active
        member of the same BU. The server checks resource authorization before
        token/card-version validation and returns 404 to callers outside the
        resource boundary. The approval transaction creates or resumes a
        mail_send_operations row keyed by mailId/cardVersion. Gmail draft and
        sent-message identifiers are persisted around each external call. A
        retry first reconciles that operation and never sends a second message
        merely because the previous HTTP response was lost.
      operationId: approveMail
      parameters:
        - $ref: "#/components/parameters/MailId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Gmail draft sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSendResponse"
        "202":
          description: Send result is being reconciled; the client must poll/refetch rather than retry approval.
          headers:
            Retry-After:
              description: Seconds before polling the mail-send operation resource.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/mail/{mailId}/reject:
    post:
      tags: [mail]
      summary: Reject a prepared Gmail draft and request deletion.
      description: >
        Personal mail may be rejected only by its owner. BU shared mail may be
        rejected only by the current claimant. The same resource and claim
        authorization rules as approve apply before token validation.
      operationId: rejectMail
      parameters:
        - $ref: "#/components/parameters/MailId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Draft rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mail/{mailId}/reissue-token:
    post:
      tags: [mail]
      summary: Reissue an expired approvalToken for a pending mail card.
      description: >
        Called automatically by the HUD when token_expires_at has passed for a
        pending mail card. Issues a new crypto.randomBytes(32) token, updates
        token_expires_at to now+72h, increments card_version, and records
        token_reissued in timeline_events. The plaintext token is returned only
        in this response and must not be stored in event_inbox or logs.
        Only the personal owner or current BU claimant may reissue a token.
        Returns 404 outside that resource boundary and 409 if the card is
        already approved or rejected.
      operationId: reissueMailToken
      security:
        - googleIdToken: []
      parameters:
        - $ref: "#/components/parameters/MailId"
      responses:
        "200":
          description: New approvalToken issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReissueTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/mail/tickets:
    get:
      tags: [mail]
      summary: List mail tickets for the Jira-style HUD ticket board (v2).
      description: >
        Returns a lightweight ticket list for the authenticated user's BU.
        Ticket status is derived from emails.status and the caller-relative claimState.
        Four ticket sections rendered by the HUD: 未着手 (unclaimed), 自分が担当 (claimed by caller),
        待機中 (pending_calendar), 他人対応中 (claimed by other BU member).
        bodyPreview and replyDraft are excluded from this response.
        Use GET /v1/mail/{mailId}/detail for full card content on demand (D-28).
      operationId: listMailTickets
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Ticket list.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mail/{mailId}/claim:
    post:
      tags: [mail]
      summary: Claim a BU shared mail for exclusive handling.
      description: >
        Atomically sets claimer_attendee_ref via conditional UPDATE WHERE claimer_attendee_ref IS NULL.
        Returns 409 if already claimed by another BU member (Layer 1 exclusion).
        The caller must be an active member of the mail's BU; non-members
        receive 404. On success, the same transaction binds
        approval_subject_hash to the claimant, issues the first plaintext
        approvalToken, sets token_expires_at, increments card_version, and
        broadcasts mail_claimed to all BU members by inserting
        event_inbox_recipients rows for each BU member.
        Before Gmail send, pg_try_advisory_lock(4, hashtext(mailId)) provides Layer 2 exclusion (D-26).
        Every claim-dependent command evaluates the 2-hour expiry predicate;
        expiry never depends on a prior list request. pending_calendar is
        excluded from the 2-hour timeout because participant approval may take
        longer, but becomes force-claimable by an active same-BU member after
        24 hours.
      operationId: claimMail
      parameters:
        - $ref: "#/components/parameters/MailId"
      responses:
        "200":
          description: Claim acquired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [mail]
      summary: Release the caller's own claim on a BU shared mail.
      description: >
        Resets claimer_attendee_ref and claimed_at to NULL.
        Only the current claim holder may release; attempting to release
        another member's claim returns 403.
        It also invalidates approval_subject_hash and the current token. On
        success, broadcasts mail_unclaimed to all BU members via event_inbox
        (D-27). A new token is issued only after a later successful claim.
      operationId: unclaimMail
      parameters:
        - $ref: "#/components/parameters/MailId"
      responses:
        "200":
          description: Claim released.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                additionalProperties: false
                properties:
                  success:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mail/{mailId}/transfer-targets:
    get:
      tags: [mail]
      summary: List active same-BU members eligible to receive this mail claim.
      operationId: listMailTransferTargets
      parameters:
        - $ref: "#/components/parameters/MailId"
      responses:
        "200":
          description: Pseudonymous transfer targets within the mail resource boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferTargetListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/mail/{mailId}/transfer:
    post:
      tags: [mail]
      summary: Transfer a BU shared mail claim to another BU member.
      description: >
        Transfers claim ownership to another member of the same BU.
        In a single transaction: updates claimer_attendee_ref to targetAttendeeRef,
        binds and reissues approvalToken for the target claimant (invalidating
        the previous token),
        updates approval_subject_hash, and increments card_version.
        Cross-BU transfer (targetAttendeeRef in a different BU) returns 400.
        On success, broadcasts mail_transferred to all BU members via event_inbox (D-27).
        Force-claim (D-49) - normally only the current claim holder may
        transfer, but when the mail has been claimed for more than 24 hours
        (including during pending_calendar, where the 2-hour lazy timeout is
        suspended), any active member of the same BU may transfer the claim to
        themselves. This resolves the absent-claim-holder deadlock. Earlier
        attempts return 403. A force-claim records timeline_events:
        mail_force_claimed and broadcasts to all BU members.
      operationId: transferMail
      parameters:
        - $ref: "#/components/parameters/MailId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Claim transferred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mail/{mailId}/detail:
    get:
      tags: [mail]
      summary: Fetch the full mail approval card with PII fields on demand.
      description: >
        Returns the complete mail card including bodyPreview, replyDraft, and
        the short-lived plaintext approvalToken. Called only when the user opens
        a specific ticket in the HUD (D-28). Personal mail is visible only to
        its owner. BU metadata is visible to active members of the same BU, but
        bodyPreview, replyDraft, and approvalToken are returned only to the
        current claimant; an unclaimed card has no approvalToken. Callers
        outside the resource boundary receive 404.
        bodyPreview and replyDraft must not be stored in event_inbox or logs.
        Renderer IPC must not persist these values beyond the card display lifetime.
      operationId: getMailDetail
      parameters:
        - $ref: "#/components/parameters/MailId"
      responses:
        "200":
          description: Full mail approval card.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/calendar/proposals/{proposalId}:
    get:
      tags: [calendar]
      summary: Fetch a current calendar proposal card for HUD display.
      description: >
        Returns the current short-lived plaintext approvalToken only to an
        authenticated Electron main/openclaw-client request when the caller has
        a proposal_approvals row for an active approval proposal. For
        manual_review_required proposals, approvalToken is omitted and HUD
        displays manualConfirmation to the claim holder. Event inbox payloads
        must not contain plaintext approvalToken because they are persisted in
        Cloud SQL. The caller must own the associated personal mail or be the
        participant/current claimant authorized by proposal_approvals within
        the same BU. Other callers receive 404.
      operationId: getCalendarProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Current calendar proposal card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarProposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/calendar/proposals/{proposalId}/reissue-token:
    post:
      tags: [calendar]
      summary: Reissue an expired approvalToken for an active calendar proposal.
      description: >
        Called automatically by the HUD when token_expires_at has passed for an
        active calendar proposal. Issues a new crypto.randomBytes(32) token,
        updates token_expires_at to now+72h, increments card_version, and records
        token_reissued in timeline_events. If any slot's slotStart is in the past,
        returns slotExpired: true so the HUD can prompt for re-planning instead.
        Returns 409 if the proposal is already approved, rejected, or superseded.
      operationId: reissueCalendarProposalToken
      security:
        - googleIdToken: []
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: New approvalToken issued, or slot expiry detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarReissueTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/calendar/proposals/{proposalId}/approve:
    post:
      tags: [calendar]
      summary: Record this participant's approval for a calendar proposal.
      description: >
        Per-participant approval. OpenClaw verifies the approvalToken,
        cardVersion, and google_subject_hash against the caller's row in
        proposal_approvals (identified by attendee_ref derived from the
        authenticated Google subject). Operating on another participant's row
        returns 403. After updating this row, the Approval aggregator checks
        all rows: if all participants are approved and every approved row has
        the same selectedSlotId, aggregate_approval_status is set to all_approved
        and a calendar operation is enqueued to Cloud Tasks (exactly once).
        selection_conflict is detected eagerly (D-35): as soon as two approved
        rows carry different selectedSlotIds the aggregate transitions to
        selection_conflict without waiting for remaining participants, and no
        Calendar write is performed. When unanimous, the transaction persists
        an immutable encrypted execution plan (action, target calendar,
        event resource/version, desired payload, selected slot, attendees) and
        an outbox event. Dispatch to Cloud Tasks occurs from the outbox; task
        creation is not part of the approval transaction. Returns 202 whether the aggregate is now
        complete or still waiting for other participants. Stale cardVersion,
        invalid token, unknown selectedSlotId, or tampered subject return 409
        without side effects. Approving a superseded or cancelled proposal
        returns 409 with code proposal_superseded and supersededByProposalId
        so the HUD can switch to the current revision (D-35).
      operationId: approveCalendarProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarApprovalRequest"
      responses:
        "202":
          description: Calendar operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/calendar/proposals/{proposalId}/reject-all:
    post:
      tags: [calendar]
      summary: Record this participant's rejection for a calendar proposal.
      description: >
        Per-participant rejection. Updates the caller's row in proposal_approvals
        to rejected with structured rejection inputs: reason code, optional
        sanitized explanation, rejected slot ids, and preferred windows. Operating
        on another participant's row returns 403. The first rejection immediately
        sets aggregate_approval_status to any_rejected and triggers alternative
        generation without waiting for all participants. The replanner uses the
        rejection inputs, existing approvals from other participants, and current
        Calendar availability; all participants re-vote on the new revision
        (D-20). Approval rows are append-only (D-32): the new revision gets
        freshly inserted proposal_approvals rows and the superseded rows are
        kept as audit history, so the replanner can walk the parent chain and
        avoid re-offering already-rejected slots. Rejecting a superseded or
        cancelled proposal returns 409 with code proposal_superseded and
        supersededByProposalId; near-simultaneous rejections from other
        participants are re-entered on the new revision's card (D-35).
      operationId: rejectCalendarProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarRejectionRequest"
      responses:
        "200":
          description: Proposal rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarRejectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/calendar/proposals/{proposalId}/cancel:
    post:
      tags: [calendar]
      summary: Manually cancel a stalled calendar proposal (responsible user only).
      description: >
        Terminates a proposal that is stalled because some participants never
        respond (OQ-MULTI-005 / D-34). Authorization follows the resource
        authorizer (D-38/D-49) - for BU shared mail the current claim holder,
        for a personal mailbox the mailbox owner (emails.owner_attendee_ref).
        Other members receive 403; callers outside the resource boundary
        receive 404. If the claim holder is absent, another BU member may
        force-claim after 24 hours (see transfer) and then cancel. In one
        transaction the proposal transitions to cancelled, all
        proposal_approvals rows are invalidated, timeline_events records
        cal_cancelled, and emails.status returns from pending_calendar to
        pending_reply_approval - which also restores the 2-hour claim timeout.
        The response includes gmailMessageId so the HUD can navigate the user
        to Gmail for a manual reply (the schedule is still unconfirmed;
        automatic reply-draft regeneration is v2). Approving, rejecting, or
        reissuing tokens on a cancelled proposal returns 409 with code
        proposal_superseded (supersededByProposalId is null for cancellation).
      operationId: cancelCalendarProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal cancelled; mail returned to reply-approval flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarCancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/calendar/proposals/{proposalId}/alternatives:
    post:
      tags: [calendar]
      summary: Generate an alternative calendar proposal after rejection or selection conflict.
      description: >
        Creates a new proposal revision from a rejected or selection-conflicted
        proposal, the source mail, previous slots, structured rejection inputs,
        existing participant approvals, and current Calendar availability. The
        previous proposal is marked superseded. Returned slot context may include
        event titles, sanitized event descriptions, and participant display names
        for HUD review, but email addresses, Google event ids, calendar ids,
        meeting URLs, and plaintext approvalToken must not be persisted in
        event_inbox payloads or logs.
      operationId: createCalendarProposalAlternative
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarAlternativeRequest"
      responses:
        "201":
          description: Alternative calendar proposal revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

